name: Validar pacote PP-MT Android e iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mobile/**
      - tests/mobile-app.test.js
permissions:
  contents: read
jobs:
  mobile-web-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar qualidade e bloqueio de pagamentos externos
        run: node --test tests/mobile-app.test.js
      - name: Preparar recursos locais do Android e iOS
        run: node mobile/prepare.mjs
      - name: Confirmar recursos essenciais do pacote nativo
        run: |
          test -s mobile/www/index.html
          test -s mobile/www/planos/privacidade.html
          test -s mobile/www/mobile-runtime.js
          test -s mobile/www/assets/news/concurso.json
      - uses: actions/upload-artifact@v4
        with:
          name: ppmt-mobile-web-assets
          path: mobile/www/
          retention-days: 7
