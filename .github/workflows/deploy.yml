name: Publicar PP MT no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check help.js && node --check auth.js
      - run: npm test
      - uses: actions/configure-pages@v5
      - name: Preparar arquivos públicos
        run: |
          mkdir dist
          cp index.html style.css app.js learning.js auth.js help.js exam-sources.js core.js data.js official.js official-1.js official-2.js official-3.js official-4.js official-al-2021.js official-es-2013-sejus.js official-ba-2024-seap.js official-rs-2022-susepe.js imported-exams.js sw.js icon.svg manifest.webmanifest dist/
          cp *.png dist/
          cp -R assets dist/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-package
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
