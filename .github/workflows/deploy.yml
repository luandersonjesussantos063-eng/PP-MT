name: Publicar PP MT no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *" # 08:17 em Mato Grosso
    - cron: "47 18 * * *" # segunda checagem às 14:47
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir publicações oficiais
        run: |
          python3 -m unittest discover -s tests -p 'test_concurso_monitor.py'
          python3 tools/update_concurso.py
      - name: Preservar resultado da checagem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/news/concurso.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza acompanhamento oficial do concurso"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              git fetch origin main
              git rebase origin/main
              if [ "$attempt" = "3" ]; then exit 1; fi
            done
          fi
      - run: npm ci
      - run: npm run build:vendor && npm run build:syllabus && npm run build:offline
      - run: node --check app.js && node --check help.js && node --check auth.js
      - run: npm test
      - uses: actions/configure-pages@v5
      - name: Preparar arquivos públicos
        run: |
          mkdir dist
          cp authorial-mt.js performance.js free-training.js concurso-news.js offline.js syllabus.js syllabus-data.js index.html style.css app.js lessons.js review-generator.js practice.js curriculum.js exam-session.js answer-sounds.js learning.js auth.js help.js exam-sources.js core.js data.js official.js official-1.js official-2.js official-3.js official-4.js official-al-2021.js official-es-2013-sejus.js official-ba-2024-seap.js official-rs-2022-susepe.js imported-exams.js sw.js icon.svg manifest.webmanifest dist/
          cp *.png dist/
          cp sitemap.xml robots.txt dist/
          cp -R assets planos dist/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-package
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
