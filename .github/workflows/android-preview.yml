name: Android PP-MT — APK de teste (sem publicação)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - "tests/android-preview.test.js"
      - ".github/workflows/android-preview.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "tests/android-preview.test.js"
      - ".github/workflows/android-preview.yml"

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JDK 21 para Capacitor 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: SDK Android
        uses: android-actions/setup-android@v3

      - name: Preparar dependencias Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Testar site e restricoes da versao nativa
        run: |
          npm ci
          npm test

      - name: Preparar bundle do app Android
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run prepare:web
          npx cap add android
          npx cap sync android

      - name: Gerar icones Android a partir da identidade PP-MT
        run: |
          python -m pip install --disable-pip-version-check "cairosvg>=2.7,<3"
          python mobile/create_android_icons.py

      - name: Compilar APK Android de depuracao
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Salvar APK somente como artefato privado do GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: PPMT-Android-Preview-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
