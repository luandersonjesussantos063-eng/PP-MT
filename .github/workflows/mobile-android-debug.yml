name: Gerar APK de teste do PP-MT (Android)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Instalar Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Empacotar conteúdos locais
        run: node mobile/prepare.mjs
      - name: Criar projeto Android
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android
      - name: Gerar APK de desenvolvimento
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ppmt-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
