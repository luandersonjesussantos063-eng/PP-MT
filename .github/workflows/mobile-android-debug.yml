name: Gerar APK de teste do PP-MT (Android)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - "tests/**"
      - ".github/workflows/mobile-android-debug.yml"
  push:
    branches: [main]
    paths:
      # Recursos web alterados precisam gerar um novo APK (não são carregados do site).
      - "mobile/**"
      - "*.js"
      - "*.css"
      - "*.html"
      - "*.json"
      - "*.webmanifest"
      - "planos/**"
      - "assets/questions/**"
      - "assets/audio/**"
      - "assets/identity/**"
      - "assets/vendor/**"
      - "tests/android-preview.test.js"
      - ".github/workflows/mobile-android-debug.yml"

permissions:
  contents: read

concurrency:
  group: ppmt-android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Runner ubuntu-latest ja inclui Android SDK. Evita setup-android@v3,
      # que solicita pacote obsoleto 'tools' e falha antes da compilacao.
      - name: Configurar Android SDK ja instalado
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Testar pacote e protecao das compras digitais
        run: |
          npm ci
          npm test

      - name: Instalar Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Empacotar recursos locais e habilitar compra externa SOMENTE no APK debug
        env:
          PPMT_ANDROID_DEBUG_PAYMENTS: 'true'
        run: |
          node mobile/prepare.mjs
          ./node_modules/.bin/esbuild ./mobile/android-payments.mjs --bundle --format=esm --platform=browser --outfile=mobile/www/android-payments.js

      - name: Gerar projeto nativo
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Vincular versionName do APK à versão web
        env:
          PPMT_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          version=json.loads(Path('version.json').read_text())['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',version):raise SystemExit('Versão inválida')
          version_code=10000+int(os.environ['PPMT_RUN_NUMBER'])
          gradle=Path('mobile/android/app/build.gradle')
          data=gradle.read_text()
          data,c1=re.subn(r'\bversionCode\s+\d+','versionCode '+str(version_code),data,count=1)
          data,c2=re.subn(r'\bversionName\s+"[^"]+"','versionName "'+version+'"',data,count=1)
          if c1!=1 or c2!=1:raise SystemExit('Não foi possível definir versão do APK')
          gradle.write_text(data)
          print('APK Android',version,'code',version_code)
          PY

      - name: Aplicar identidade visual PP-MT ao icone nativo
        run: |
          python -m pip install --disable-pip-version-check "cairosvg>=2.7,<3"
          python mobile/create_android_icons.py

      - name: Compilar APK DEBUG (nunca publicar)
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK de teste — somente artefato privado
        uses: actions/upload-artifact@v4
        with:
          name: ppmt-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
